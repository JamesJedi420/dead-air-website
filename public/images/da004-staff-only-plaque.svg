<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-label="STAFF ONLY brass door plaque">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6031"/>
      <stop offset="0.14" stop-color="#3f301b"/>
      <stop offset="0.52" stop-color="#5a4426"/>
      <stop offset="0.82" stop-color="#2c2114"/>
      <stop offset="1" stop-color="#6d5128"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0aa63"/>
      <stop offset="0.28" stop-color="#705226"/>
      <stop offset="0.58" stop-color="#2a1c0e"/>
      <stop offset="1" stop-color="#9d7b3f"/>
    </linearGradient>
    <radialGradient id="screw" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#d9bd7c"/>
      <stop offset="0.42" stop-color="#8b6a36"/>
      <stop offset="1" stop-color="#2a1e10"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.68"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="soft-light"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="12" y="14" width="576" height="132" rx="8" fill="url(#rim)"/>
    <rect x="18" y="20" width="564" height="120" rx="5" fill="url(#metal)" stroke="#2a1b0c" stroke-width="3"/>
    <rect x="27" y="29" width="546" height="102" rx="3" fill="none" stroke="#a8864b" stroke-opacity="0.58" stroke-width="2"/>
    <g filter="url(#grain)">
      <rect x="28" y="30" width="544" height="100" rx="2" fill="transparent"/>
    </g>

    <g>
      <circle cx="52" cy="80" r="13" fill="url(#screw)" stroke="#1a1209" stroke-width="2"/>
      <line x1="45" y1="87" x2="59" y2="73" stroke="#22170b" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="548" cy="80" r="13" fill="url(#screw)" stroke="#1a1209" stroke-width="2"/>
      <line x1="541" y1="87" x2="555" y2="73" stroke="#22170b" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <text x="300" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" letter-spacing="5" fill="#d8b66f" stroke="#4a3316" stroke-width="1.2" paint-order="stroke fill">STAFF ONLY</text>
  </g>
</svg>
