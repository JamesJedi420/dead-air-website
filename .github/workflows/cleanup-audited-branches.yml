name: Cleanup audited obsolete branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.repository == 'JamesJedi420/dead-air-website' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retired-branch-cleanup]'))
    runs-on: ubuntu-latest
    env:
      CLEANUP_BRANCH: agent/retired-branch-audit-cleanup
      CLEANUP_PR_NUMBER: "26"
      BRANCH_SHA_ALLOWLIST: |
        agent/about-page-rewrite aa7360f834863bf15ab836e06f61c95c6c79fb83
        agent/da-002-manuscript-import f25656240872bbb48876d90892b48ab5e660e7dc
        agent/homepage-live-copy e85ec644c5c6a92478130d766811a632e0f29b89
        agent/narrative-timeline-standard 663742b285dd6e874cf6ead1b9624c0d44987d3a
        agent/numbered-story-sections d3b65dca9c0f2be76f43a47816cc3613bbf9f2da
        agent/publish-the-building-keeps-the-hour 33dbe4588b6b085a4b39ccac97f54de93cbcbd78
        agent/standardize-story-source-note 74ddc6049505c36b7059d9035396d679047c3231
        agent/switch-default-to-main e37812392f19a07e7d079fe96d91fdb432e9081d
        feature/da-002-private-preview 59f28464e82e9e950b32ceb9c6a8d74a73ab5093
        release/da-002-freeze 9d665e0083f72f39d10d04c1a4d608555cb97fa5
    steps:
      - name: Preflight, delete, and verify audited refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_ref() {
            local branch="$1"
            local body_file="$2"

            curl --silent --show-error --location \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
          }

          branches=()
          expected_shas=()
          while read -r branch expected_sha; do
            [ -z "${branch}" ] && continue
            branches+=("${branch}")
            expected_shas+=("${expected_sha}")
          done <<<"${BRANCH_SHA_ALLOWLIST}"
          branches+=("${CLEANUP_BRANCH}")
          expected_shas+=("MERGED_PR_HEAD")

          existing_branches=()
          blocked=0

          for index in "${!branches[@]}"; do
            branch="${branches[$index]}"
            expected_sha="${expected_shas[$index]}"

            open_pr_count="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state="open" \
                -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" \
                -F per_page=1 \
                --jq 'length'
            )"
            if [ "${open_pr_count}" -ne 0 ]; then
              echo "Open pull request still uses ${branch}; refusing deletion." >&2
              blocked=1
              continue
            fi

            body_file="$(mktemp)"
            status_code="$(get_ref "${branch}" "${body_file}")"

            case "${status_code}" in
              200)
                current_sha="$(jq -r '.object.sha' "${body_file}")"
                if [ "${expected_sha}" = "MERGED_PR_HEAD" ]; then
                  cleanup_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CLEANUP_PR_NUMBER}")"
                  cleanup_merged_at="$(jq -r '.merged_at // empty' <<<"${cleanup_pr}")"
                  cleanup_head_ref="$(jq -r '.head.ref' <<<"${cleanup_pr}")"
                  cleanup_head_sha="$(jq -r '.head.sha' <<<"${cleanup_pr}")"

                  if [ -z "${cleanup_merged_at}" ] || [ "${cleanup_head_ref}" != "${branch}" ] || [ "${cleanup_head_sha}" != "${current_sha}" ]; then
                    echo "${branch} is not the verified merged head of PR #${CLEANUP_PR_NUMBER}; refusing deletion." >&2
                    blocked=1
                  else
                    existing_branches+=("${branch}")
                  fi
                elif [ "${current_sha}" != "${expected_sha}" ]; then
                  echo "${branch} moved from audited SHA ${expected_sha} to ${current_sha}; preserving it." >&2
                  blocked=1
                else
                  existing_branches+=("${branch}")
                fi
                ;;
              404)
                echo "Already absent: ${branch}"
                ;;
              *)
                echo "Unexpected GitHub API response ${status_code} while reading ${branch}:" >&2
                cat "${body_file}" >&2
                rm -f "${body_file}"
                exit 1
                ;;
            esac

            rm -f "${body_file}"
          done

          if [ "${blocked}" -ne 0 ]; then
            exit 1
          fi

          for branch in "${existing_branches[@]}"; do
            echo "Deleting confirmed obsolete branch ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" > /dev/null
          done

          for branch in "${branches[@]}"; do
            body_file="$(mktemp)"
            status_code="$(get_ref "${branch}" "${body_file}")"

            case "${status_code}" in
              404)
                ;;
              200)
                echo "Branch still exists after cleanup: ${branch}" >&2
                rm -f "${body_file}"
                exit 1
                ;;
              *)
                echo "Unexpected GitHub API response ${status_code} while verifying ${branch}:" >&2
                cat "${body_file}" >&2
                rm -f "${body_file}"
                exit 1
                ;;
            esac

            rm -f "${body_file}"
          done

          echo "Audited obsolete branch cleanup completed successfully."
