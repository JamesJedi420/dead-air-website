name: Import DA-004 approved source

on:
  push:
    branches:
      - release/da-004-withheld
    paths:
      - .github/workflows/import-da004-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/da-004-withheld
          fetch-depth: 0
      - name: Export frozen approved Drive source
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            'https://docs.google.com/document/d/1RB0F4ShpEv9ewV9gXDkm4woHfaCGLDz9TV0xNYqHF38/export?format=txt' \
            -o /tmp/da004-approved.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          raw_path = Path('/tmp/da004-approved.txt')
          raw = raw_path.read_bytes()
          text = raw.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')

          if not text.startswith('DA-004 — Final Approval Repair Revision v1.7'):
              raise SystemExit('Drive export did not return the frozen DA-004 v1.7 manuscript.')

          pattern = re.compile(r'^DA-004 — Scene (\d{2}) — (.+?) — (?:Approved Draft|Draft) v[0-9.]+$', re.M)
          matches = list(pattern.finditer(text))
          if len(matches) != 10:
              raise SystemExit(f'Expected 10 DA-004 scene headings, found {len(matches)}.')

          source_dir = Path('src/manuscripts/da-004')
          source_dir.mkdir(parents=True, exist_ok=True)
          fragments = []
          for i, match in enumerate(matches):
              start = match.end()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
              body = re.sub(r'\n{3,}', '\n\n', text[start:end]).strip()
              fragment = f"Scene {match.group(1)} — {match.group(2)}\n\n{body}\n\n"
              fragments.append(fragment)
              (source_dir / f'part-{i + 1:02d}.mdfrag').write_text(fragment, encoding='utf-8')

          canonical = re.sub(r'\n{3,}', '\n\n', ''.join(fragments)).rstrip() + '\n'
          raw_sha = hashlib.sha256(raw).hexdigest()
          canonical_sha = hashlib.sha256(canonical.encode('utf-8')).hexdigest()

          lock = {
              'case': 'DA-004',
              'title': 'Close Enough to Recognize',
              'approvedRevision': 'Final Approved Story v1.7',
              'authoritativeGoogleDocId': '1RB0F4ShpEv9ewV9gXDkm4woHfaCGLDz9TV0xNYqHF38',
              'authoritativeGoogleDocRevisionId': 'ANLCKQmfEqSBabL5tpiv0nQaM2sOUc4pCvWufpRpil4o45XUd59NmY1AD0ygCNIJbGMBy7uY4D2DkJq312R2RMV5Nc3vWVs3n1ve8LOF3m4',
              'rawDriveExportSha256': raw_sha,
              'canonicalRepositorySourceSha256': canonical_sha,
              'sceneCount': 10,
              'sourceFragments': [f'part-{i:02d}.mdfrag' for i in range(1, 11)],
              'publicationAuthorized': False,
              'releaseState': 'withheld-output preparation'
          }
          (source_dir / 'approved-source-lock.json').write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          print(f'DA-004 source import verified: 10 scenes; raw SHA-256 {raw_sha}; canonical SHA-256 {canonical_sha}.')
          PY
      - name: Commit repository-native source lock
        run: |
          set -euo pipefail
          git config user.name 'dead-air-release-bot'
          git config user.email 'dead-air-release-bot@users.noreply.github.com'
          git add src/manuscripts/da-004
          git commit -m 'Lock DA-004 approved source for withheld release preparation'
          git push origin HEAD:release/da-004-withheld
