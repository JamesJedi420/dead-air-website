name: Check Netlify secret temp

on:
  push:
    branches:
      - ops/export-v24-source

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deploy credential exists
        env:
          HAS_NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
          HAS_NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN != '' }}
          HAS_NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN != '' }}
          HAS_NETLIFY_PERSONAL_ACCESS_TOKEN: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN != '' }}
        run: |
          echo "NETLIFY_AUTH_TOKEN_PRESENT=$HAS_NETLIFY_AUTH_TOKEN"
          echo "NETLIFY_ACCESS_TOKEN_PRESENT=$HAS_NETLIFY_ACCESS_TOKEN"
          echo "NETLIFY_TOKEN_PRESENT=$HAS_NETLIFY_TOKEN"
          echo "NETLIFY_PERSONAL_ACCESS_TOKEN_PRESENT=$HAS_NETLIFY_PERSONAL_ACCESS_TOKEN"
