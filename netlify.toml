[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/dead-air-da-002-the-name-in-the-room"
  to = "/stories/da-002-the-name-in-the-room/"
  status = 301
  force = true

[[redirects]]
  from = "/dead-air-da-002-the-name-in-the-room/"
  to = "/stories/da-002-the-name-in-the-room/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
