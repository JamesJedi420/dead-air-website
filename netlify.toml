[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#custom"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    fail_deploy_on_score_thresholds = "true"

  [plugins.inputs.thresholds]
    performance = 0.80
    accessibility = 1.00
    best-practices = 0.90
    seo = 1.00

  [plugins.inputs.settings]
    preset = "desktop"

  [[plugins.inputs.audits]]
    path = "stories/da-002-the-name-in-the-room/index.html"

[[redirects]]
  from = "/dead-air-da-002-the-name-in-the-room"
  to = "/stories/da-002-the-name-in-the-room/"
  status = 301
  force = true

[[redirects]]
  from = "/dead-air-da-002-the-name-in-the-room/"
  to = "/stories/da-002-the-name-in-the-room/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
